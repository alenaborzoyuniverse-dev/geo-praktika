<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Проверьте, как хорошо вы знаете 32 района Омской области.">
  <title>Районы Омской области · Геопрактика</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="districts.js"></script>
  <script defer src="omsk-identify.js"></script>
  <script defer src="quiz.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Геопрактика</div>
      <nav class="exercise-nav" aria-label="Тренажёры">
        <a href="index.html" aria-current="page">Омская область</a>
        <a href="russia.html">Россия</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="intro">
      <p class="category"><span></span> Омская область</p>
      <h1>Районы на карте</h1>
      <p class="description">Найдите районы Омской области или узнайте их по расположению.</p>
    </div>
    <div id="omsk-tabs" class="omsk-tabs" role="tablist" aria-label="Режим тренировки" hidden>
      <button type="button" id="omsk-find-tab" role="tab" aria-controls="omsk-find" aria-selected="true">Найди на карте</button>
      <button type="button" id="omsk-identify-tab" role="tab" aria-controls="omsk-identify" aria-selected="false" tabindex="-1">Угадай район</button>
    </div>
    <div class="workspace" id="omsk-workspace">
      <section class="quiz" id="omsk-find" role="tabpanel" aria-labelledby="omsk-find-tab">
        <div class="question" aria-live="polite" aria-atomic="true">
          <p id="prompt" class="prompt">Покажите на карте</p>
          <h2 id="target">Загрузка карты…</h2>
        </div>
        <div id="feedback" role="status" class="feedback">Нажмите на нужный район.</div>
        <div class="results">
          <div class="result-head">
            <label for="progress">Районы найдены</label>
            <span class="count"><strong id="solved">0</strong><span> / </span><span id="total">32</span></span>
          </div>
          <progress id="progress" value="0" max="32"></progress>
          <p class="mistakes">Ошибки <strong id="mistakes">0</strong></p>
        </div>
        <button id="restart" class="restart" type="button" disabled><span aria-hidden="true">↻</span> Начать заново</button>
      </section>
      <section class="quiz omsk-identify" id="omsk-identify" role="tabpanel" aria-labelledby="omsk-identify-tab" hidden>
        <div id="omsk-identify-round">
          <div class="result-head">
            <label for="omsk-identify-progress">Пройдено</label>
            <span class="count" id="omsk-identify-count"></span>
          </div>
          <progress id="omsk-identify-progress" value="0" max="20"></progress>
          <h2 id="omsk-identify-question" tabindex="-1">Какой район выделен на карте?</h2>
          <div id="omsk-identify-options" role="group" aria-label="Варианты ответа"></div>
          <p id="omsk-identify-feedback" class="feedback" role="status"></p>
          <button type="button" class="omsk-continue" id="omsk-identify-next" hidden>Следующий вопрос</button>
        </div>
        <div id="omsk-identify-result" hidden>
          <h2 id="omsk-identify-result-title" tabindex="-1">Раунд завершён</h2>
          <p id="omsk-identify-score"></p>
          <button type="button" class="restart" id="omsk-identify-replay">Сыграть ещё раз</button>
        </div>
      </section>
      <figure class="map-panel">
        <div class="map-top">
          <figcaption>Контурная карта</figcaption>
          <div class="legend"><span><i class="swatch correct"></i> Найден</span><span><i class="swatch incorrect"></i> Ошибка</span></div>
        </div>
        <div class="map-frame">
          <div class="north" aria-hidden="true">С<span></span></div>
          <svg id="map" aria-label="Карта районов Омской области" role="group"></svg>
          <div class="map-controls" aria-label="Масштаб карты">
            <button type="button" id="zoom-in" aria-label="Приблизить">+</button>
            <button type="button" id="zoom-out" aria-label="Отдалить" disabled>−</button>
          </div>
        </div>
        <div class="map-bottom">
          <span>Границы по карте 2012 года</span>
          <span>Адаптация <a href="https://commons.wikimedia.org/wiki/File:Outline-Omskaya.svg">Nzeemin / OpenStreetMap</a> · <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a></span>
        </div>
      </figure>
    </div>
  </main>
  <noscript><p class="no-script">Для работы тренажёра включите JavaScript в браузере.</p></noscript>
</body>
</html>
