<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Тренажёр по географическому положению России. Найдите объекты на карте или угадайте их по выделенному контуру.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="Геопрактика">
  <meta property="og:title" content="География России · Геопрактика">
  <meta property="og:description" content="Найди на карте реки, моря и другие объекты России или угадай их по выделенному контуру.">
  <meta property="og:url" content="https://alenaborzoyuniverse-dev.github.io/geo-praktika/russia.html">
  <meta property="og:image" content="https://alenaborzoyuniverse-dev.github.io/geo-praktika/geo-praktika-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Геопрактика. География на карте. Контур России с отметкой Омска.">
  <meta name="twitter:card" content="summary_large_image">
  <title>Географическое положение России · Геопрактика</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="russia.css?v=identify-mobile">
  <script defer src="russia-topics.js"></script>
  <script defer src="russia-data.js"></script>
  <script defer src="russia-region-data.js"></script>
  <script defer src="russia-map.js"></script>
  <script defer src="russia-region-map.js"></script>
  <script defer src="russia-quiz.js"></script>
  <script defer src="russia-identify.js?v=identify-colors"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Геопрактика</div>
      <nav class="exercise-nav" aria-label="Тренажёры">
        <a href="index.html">Омская область</a>
        <a href="russia.html" aria-current="page">Россия</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="intro russia-intro">
      <h1 id="russia-heading">Географическое положение России</h1>
      <p class="description">Тренируйтесь находить объекты на карте и узнавать их по расположению.</p>
    </div>
    <div class="russia-tabs" role="tablist" aria-label="Режим тренировки" hidden>
      <button type="button" id="find-tab" role="tab" aria-controls="find-panel" aria-selected="true">Найди на карте</button>
      <button type="button" id="identify-tab" role="tab" aria-controls="identify-panel" aria-selected="false" tabindex="-1">Угадай объект</button>
    </div>
    <div id="find-panel" role="tabpanel" aria-labelledby="find-tab" class="workspace russia-workspace">
      <section class="quiz russia-quiz" aria-labelledby="russia-target">
        <div class="mode">
          <label for="topic">Тема раунда</label>
          <select id="topic"></select>
          <div id="region-field" hidden>
            <label for="region">Регион</label>
            <select id="region"></select>
          </div>
          <p id="mode-note" class="mode-note" hidden></p>
        </div>
        <div class="question" aria-live="polite" aria-atomic="true">
          <p id="russia-prompt" class="prompt">Покажите на карте</p>
          <h2 id="russia-target" tabindex="-1">Загрузка карты…</h2>
        </div>
        <p id="russia-feedback" role="status" class="feedback"></p>
        <button type="button" class="next" id="next" disabled>Следующий объект</button>
        <div class="results">
          <div class="result-head">
            <label for="russia-progress">Найдено</label>
            <span class="count" id="russia-count"></span>
          </div>
          <progress id="russia-progress" value="0" max="1"></progress>
          <p class="mistakes">Ошибки <strong id="russia-mistakes">0</strong></p>
        </div>
        <button type="button" id="review" class="review" hidden>Повторить ошибки</button>
        <button type="button" id="russia-restart" class="restart">Начать заново</button>
      </section>
      <figure class="map-panel russia-map-panel">
        <div class="map-top">
          <figcaption id="map-caption">Контурная карта</figcaption>
          <div class="legend"><span><i class="swatch correct"></i> Верно</span><span><i class="swatch incorrect"></i> Ошибка</span></div>
        </div>
        <div class="map-frame russia-frame">
          <svg id="russia-map" viewBox="0 0 760 460" aria-label="Карта для ответа" role="group"></svg>
        </div>
        <div class="map-bottom"><span id="map-scale"></span><a href="https://www.naturalearthdata.com/">Контуры Natural Earth</a></div>
      </figure>
    </div>
    <div id="identify-panel" role="tabpanel" aria-labelledby="identify-tab" hidden>
      <div class="workspace russia-workspace" id="identify-round">
        <section class="quiz identify-quiz" aria-labelledby="identify-prompt">
          <div class="result-head">
            <label for="identify-progress">Смешанный раунд</label>
            <span class="count" id="identify-count"></span>
          </div>
          <progress id="identify-progress" value="0" max="20"></progress>
          <h2 id="identify-prompt" tabindex="-1">Как называется выделенный объект?</h2>
          <div id="identify-options" role="group" aria-label="Варианты ответа"></div>
          <p id="identify-feedback" class="feedback" role="status"></p>
          <button type="button" id="identify-next" class="next" hidden>Следующий вопрос</button>
        </section>
        <figure class="map-panel russia-map-panel">
          <div class="map-top"><figcaption>Контурная карта</figcaption></div>
          <div class="map-frame russia-frame">
            <svg id="identify-map" viewBox="0 0 760 460" role="img" aria-label="Карта с выделенным объектом"></svg>
          </div>
          <div class="map-bottom"><a href="https://www.naturalearthdata.com/">Контуры Natural Earth</a></div>
        </figure>
      </div>
      <section id="identify-result" class="quiz identify-result" aria-labelledby="identify-result-title" hidden>
        <h2 id="identify-result-title" tabindex="-1">Раунд завершён</h2>
        <p id="identify-score"></p>
        <button type="button" id="identify-replay" class="restart">Сыграть ещё раз</button>
      </section>
    </div>
  </main>
  <noscript><p class="no-script">Для работы тренажёра включите JavaScript в браузере.</p></noscript>
</body>
</html>
